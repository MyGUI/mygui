name: Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux: Ogre + Dummy + GL + GL3, all features, all apps, shared"
            preset: full
            rendersystem: 3
            platform_tests: true
            rendersystems: "1;3;4;7"
            cmake_flags: -DBUILD_SHARED_LIBS=ON
            build_jobs: 4 # limit parallel compilation to avoid OOM on Ogre-heavy builds

          - os: ubuntu-latest
            name: "Linux: Ogre + Dummy + GL + GL3, all features, all apps, static"
            preset: full
            rendersystem: 3
            rendersystems: "1;3;4;7"
            cmake_flags: -DBUILD_SHARED_LIBS=OFF
            build_jobs: 4 # limit parallel compilation to avoid OOM on Ogre-heavy builds

          - os: ubuntu-latest
            name: "Linux: GL3, no features, platform tests"
            preset: minimal
            rendersystem: 7
            platform_tests: true

          - os: ubuntu-latest
            name: "Linux: Vulkan, no features, platform tests, shared"
            preset: minimal
            rendersystem: 10
            platform_tests: true

          - os: windows-latest
            name: "Windows: dx11 + GL + GL3, all features, just tools, shared"
            preset: full
            rendersystem: 6
            platform_tests: true
            rendersystems: "4;6;7"
            cmake_flags: -DBUILD_SHARED_LIBS=ON -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_ADVANCED_DEMOS=OFF -DMYGUI_BUILD_TEST_APP=OFF

          - os: windows-latest
            name: "Windows: dx11 + GL + GL3, all features, just tools, static"
            preset: full
            rendersystem: 6
            rendersystems: "4;6;7"
            cmake_flags: -DBUILD_SHARED_LIBS=OFF -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_ADVANCED_DEMOS=OFF -DMYGUI_BUILD_TEST_APP=OFF

          - os: macos-latest
            name: "macOS: GL3 + GL, no features, just test app"
            preset: minimal
            rendersystem: 7
            platform_tests: true
            rendersystems: "4;7"
            cmake_flags: -DMYGUI_BUILD_TEST_APP=ON

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq cmake libfreetype6-dev libsdl2-dev libsdl2-image-dev libgl1-mesa-dev ${{ matrix.platform_tests && 'libgl1-mesa-dri xvfb xauth' || '' }}

      - name: Set up Ogre
        if: runner.os == 'Linux' && matrix.rendersystem == 3
        uses: ./.github/actions/setup-ogre

      - name: Set up Vulkan (Linux)
        if: runner.os == 'Linux' && matrix.rendersystem == 10
        run: |
          sudo apt-get install -qq libvulkan-dev mesa-vulkan-drivers
          # Use CPU rendering, including on runners without a GPU.
          lavapipe_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${lavapipe_icds[0]}"
          printf 'VK_DRIVER_FILES=%s\n' "${lavapipe_icds[0]}" >> "$GITHUB_ENV"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake freetype sdl2 sdl2_image

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -B build
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"' || '' }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMYGUI_RENDERSYSTEM=${{ matrix.rendersystem }}
          ${{ matrix.rendersystems && format('-DMYGUI_BUILD_RENDERSYSTEMS="{0}"', matrix.rendersystems) || '' }}
          ${{ matrix.cmake_flags }}
          -DMYGUI_BUILD_UNITTESTS=ON
          -DMYGUI_BUILD_PLATFORM_TESTS=${{ matrix.platform_tests && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel ${{ matrix.build_jobs || '' }}

      - name: Run unit tests
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --no-tests=error --timeout 5 -LE platform

      - name: Run platform tests (Linux)
        if: matrix.platform_tests && runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
        run: xvfb-run -a ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --no-tests=error --timeout 120 -L platform

      - name: Run platform tests (Windows and macOS)
        if: matrix.platform_tests && runner.os != 'Linux'
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --no-tests=error --timeout 120 -L platform

      - name: Install
        if: runner.os == 'Linux'
        run: cmake --install build --prefix ${{ github.workspace }}/install

      - name: Test install (consumer build)
        if: runner.os == 'Linux'
        run: |
          mkdir consumer-test
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.25)' \
            'project(TestInstall)' \
            'list(APPEND CMAKE_MODULE_PATH "${{ github.workspace }}/CMake")' \
            'include(TestInstall)' \
            > consumer-test/CMakeLists.txt
          cmake -S consumer-test -B consumer-test/build \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DMYGUI_RENDERSYSTEM=${{ matrix.rendersystem }}
          cmake --build consumer-test/build

  sanitizers:
    name: "Linux: Debug unit tests, ASan + UBSan"
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq cmake clang llvm libclang-rt-dev

      - name: Configure
        run: >
          cmake --preset minimal -B build-sanitizers
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DMYGUI_RENDERSYSTEM=1
          -DMYGUI_BUILD_UNITTESTS=ON
          -DMYGUI_ADDRESS_SANITIZER=ON
          -DMYGUI_UB_SANITIZER=ON

      - name: Build
        run: cmake --build build-sanitizers --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build-sanitizers --output-on-failure --no-tests=error --timeout 30

  emscripten:
    name: "emscripten: GLES, TestApp, core and browser tests"
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -qq cmake python3-venv

      - name: Set up browser tests
        run: |
          python3 -m venv build/browser-tests
          build/browser-tests/bin/python -m pip install -r Scripts/Tests/browser-requirements.txt
          build/browser-tests/bin/python -m playwright install --with-deps --only-shell chromium

      - name: Configure
        run: |
          emcmake cmake --preset minimal -B build \
            -DMYGUI_RENDERSYSTEM=8 \
            -DMYGUI_BUILD_TEST_APP=ON \
            -DMYGUI_BUILD_UNITTESTS=ON \
            -DMYGUI_BUILD_PLATFORM_TESTS=ON \
            -DPython3_EXECUTABLE="$PWD/build/browser-tests/bin/python" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run core unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 30 -LE platform

      - name: Run browser platform tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 -L platform

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-platform-tests
          path: build/UnitTests/UnitTest_Platform/artifacts
          if-no-files-found: ignore
