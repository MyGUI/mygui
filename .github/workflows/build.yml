name: Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux: GL3, all, shared"
            rendersystem: 7
            cmake_flags: >
              -DMYGUI_ALL_FEATURES=ON
              -DMYGUI_ALL_APPS=ON
              -DBUILD_SHARED_LIBS=ON

          - os: ubuntu-latest
            name: "Linux: GL3, all, static"
            rendersystem: 7
            cmake_flags: >
              -DMYGUI_ALL_FEATURES=ON
              -DMYGUI_ALL_APPS=ON
              -DBUILD_SHARED_LIBS=OFF

          - os: windows-latest
            name: "Windows: dx11, TestApp only"
            rendersystem: 6
            cmake_flags: -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_TOOLS=OFF -DMYGUI_BUILD_TEST_APP=ON -DMYGUI_NO_FEATURES=ON

          - os: macos-latest
            name: "macOS: GL3, TestApp only"
            rendersystem: 7
            cmake_flags: -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_TOOLS=OFF -DMYGUI_BUILD_TEST_APP=ON -DMYGUI_NO_FEATURES=ON

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq cmake libfreetype6-dev libsdl2-dev libsdl2-image-dev libgl1-mesa-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake freetype sdl2 sdl2_image

      - name: Install deps via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2 freetype

      - name: Configure
        run: >
          cmake -S . -B build
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"' || '' }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMYGUI_HIGH_LEVEL_WARNINGS=TRUE
          -DMYGUI_RENDERSYSTEM=${{ matrix.rendersystem }}
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Install
        if: runner.os == 'Linux'
        run: cmake --install build --prefix ${{ github.workspace }}/install

      - name: Test install (consumer build)
        if: runner.os == 'Linux'
        run: |
          mkdir consumer-test
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.25)' \
            'project(TestInstall)' \
            'list(APPEND CMAKE_MODULE_PATH "${{ github.workspace }}/CMake")' \
            'include(TestInstall)' \
            > consumer-test/CMakeLists.txt
          cmake -S consumer-test -B consumer-test/build \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build consumer-test/build

  emscripten:
    name: "emscripten: GLES, TestApp only"
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -qq cmake

      - name: Configure
        run: |
          emcmake cmake -S . -B build \
            -DMYGUI_RENDERSYSTEM=8 \
            -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_TOOLS=OFF -DMYGUI_BUILD_TEST_APP=ON -DMYGUI_NO_FEATURES=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel
