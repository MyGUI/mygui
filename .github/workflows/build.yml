name: Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Linux: Ogre + Dummy + GL + GL3, all features, all apps, shared"
            preset: full
            rendersystem: 3
            rendersystems: "1;3;4;7"
            cmake_flags: -DBUILD_SHARED_LIBS=ON
            linux_deps: libogre-1.12-dev
            build_jobs: 4 # limit parallel compilation to avoid OOM on Ogre-heavy builds

          - os: ubuntu-latest
            name: "Linux: Ogre + Dummy + GL + GL3, all features, all apps, static"
            preset: full
            rendersystem: 3
            rendersystems: "1;3;4;7"
            cmake_flags: -DBUILD_SHARED_LIBS=OFF
            linux_deps: libogre-1.12-dev
            build_jobs: 4 # limit parallel compilation to avoid OOM on Ogre-heavy builds

          - os: ubuntu-latest
            name: "Linux: GL3, no features, just tools, static"
            preset: minimal
            rendersystem: 7
            cmake_flags: -DBUILD_SHARED_LIBS=OFF -DMYGUI_BUILD_TOOLS=ON

          - os: windows-latest
            name: "Windows: dx11 + GL + GL3, all features, just tools, shared"
            preset: full
            rendersystem: 6
            rendersystems: "4;6;7"
            cmake_flags: -DBUILD_SHARED_LIBS=ON -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_UNITTESTS=ON

          - os: windows-latest
            name: "Windows: dx11 + GL + GL3, all features, just tools, static"
            preset: full
            rendersystem: 6
            rendersystems: "4;6;7"
            cmake_flags: -DBUILD_SHARED_LIBS=OFF -DMYGUI_BUILD_DEMOS=OFF -DMYGUI_BUILD_UNITTESTS=ON

          - os: macos-latest
            name: "macOS: GL3 + GL, no features, just test app"
            preset: minimal
            rendersystem: 7
            rendersystems: "4;7"
            cmake_flags: -DMYGUI_BUILD_TEST_APP=ON

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq cmake libfreetype6-dev libsdl2-dev libsdl2-image-dev libgl1-mesa-dev ${{ matrix.linux_deps || '' }}

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake freetype sdl2 sdl2_image

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -B build
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"' || '' }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DMYGUI_RENDERSYSTEM=${{ matrix.rendersystem }}
          ${{ matrix.rendersystems && format('-DMYGUI_BUILD_RENDERSYSTEMS="{0}"', matrix.rendersystems) || '' }}
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel ${{ matrix.build_jobs || '' }}

      - name: Install
        if: runner.os == 'Linux'
        run: cmake --install build --prefix ${{ github.workspace }}/install

      - name: Test install (consumer build)
        if: runner.os == 'Linux'
        run: |
          mkdir consumer-test
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.25)' \
            'project(TestInstall)' \
            'list(APPEND CMAKE_MODULE_PATH "${{ github.workspace }}/CMake")' \
            'include(TestInstall)' \
            > consumer-test/CMakeLists.txt
          cmake -S consumer-test -B consumer-test/build \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DMYGUI_RENDERSYSTEM=${{ matrix.rendersystem }}
          cmake --build consumer-test/build

  emscripten:
    name: "emscripten: GLES, TestApp only"
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -qq cmake

      - name: Configure
        run: |
          emcmake cmake --preset minimal -B build \
            -DMYGUI_RENDERSYSTEM=8 \
            -DMYGUI_BUILD_TEST_APP=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel
